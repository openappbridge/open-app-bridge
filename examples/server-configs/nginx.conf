# Routing/header skeleton only; see README.md. Replace /srv/app with a build
# containing the application-supplied restricted Documents and resource graph.
location = /.well-known/open-app-bridge {
    alias /srv/app/open-app-bridge.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /manifest.webmanifest {
    alias /srv/app/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
}

location = /app-icon.png {
    alias /srv/app/app-icon.png;
    default_type image/png;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /_oab/detached-helper {
    alias /srv/app/detached-helper.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location = /.well-known/open-app-bridge/callback {
    alias /srv/app/oab-callback.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location = /_oab/receive {
    alias /srv/app/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-yWjp6X7L9yDoL9kNnbJwPcOSFZc7Jycj8BFWlRpxWV0='; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

# Put the complete transitive resource graph imported by receive, helper, and
# callback Documents in /srv/app/oab-resources/. This prefix must contain no
# ordinary app assets. These headers do not override a historical controlling
# service worker; complete the separate OAB-disabled migration deployment first.
location ^~ /_oab/resources/ {
    alias /srv/app/oab-resources/;
    add_header Cache-Control "no-store" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
